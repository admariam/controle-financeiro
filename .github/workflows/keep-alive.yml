name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta rotina chama o banco a cada 3 dias para evitar a pausa.
# Se o projeto já estiver pausado, a execução falha e o GitHub avisa por e-mail.

on:
  schedule:
    - cron: '17 11 */3 * *' # ~08:17 em Brasília, a cada 3 dias
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o banco
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY não configurados."
            exit 1
          fi

          # Usa só a origem (aceita URL colada com /rest/v1 no final).
          base=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')

          call() {
            curl -sS -o /tmp/resp -w '%{http_code}' --max-time 30 \
              --retry 3 --retry-delay 10 --retry-all-errors \
              -H "apikey: $SUPABASE_KEY" "$@" || echo 000
          }

          code=$(call -X POST -H 'Content-Type: application/json' -d '{}' \
            "$base/rest/v1/rpc/keep_alive")
          echo "keep_alive: HTTP $code"

          if [ "$code" = "200" ]; then
            echo "Banco respondeu: $(cat /tmp/resp)"
            exit 0
          fi

          if [ "$code" = "404" ]; then
            # Função ainda não criada: rode supabase/migrations/2026-11-27_keep_alive.sql.
            # Enquanto isso, uma consulta comum já gera atividade no banco
            # (sem permissão para anon, a resposta 401 vem do próprio Postgres).
            echo "::warning::Função keep_alive não existe. Rode supabase/migrations/2026-11-27_keep_alive.sql no SQL Editor."
            code=$(call "$base/rest/v1/profiles?select=id&limit=1")
            echo "profiles: HTTP $code"
            case "$code" in
              200|401|403) exit 0 ;;
            esac
          fi

          echo "::error::Supabase não respondeu (HTTP $code). O projeto pode estar pausado: abra o painel e clique em Resume project."
          exit 1
